<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../common.css">
    <script src="index.js" defer></script>
</head>
<body>
    <div class="demo-wrap">
        <h1>Чат виджет демо</h1>
        <p>Через 15 секунд появится пузырь</p>
    </div>
    <div class="chat-bubble" id="chatBubble">
        <p> Здравствуйте! Подсказать что-нибудь?</p>
        <button class="chat-bubble__close" id="bubbleClose">X</button>
    </div>
    <button class="chat-btn" id="chatBtn">💬</button>
    <div class="chat-panel" id="chatPanel">
        <div class="chat-panel__header">
            Чат поддержки
            <button class="chat-panel__close" id="panelClose">Х</button>
        </div>
        <div class="chat-panel__body">
            <p>Здравствуйте! Чем можем Вам помочь?</p>
        </div>
    </div>
</body>
</html>
